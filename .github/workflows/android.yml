# Android アプリ（APK）を自動でビルドして GitHub のリリースに置く
# アプリ本体（gymnastics_delay_cam.html など）や android/ を更新して push すると、
# 数分後にリリースの APK が新しい版になる（配布用 URL は変わらない）
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'gymnastics_delay_cam.html'
      - 'tailwind.css'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Webアプリをアプリ内に同梱
        run: |
          mkdir -p android/app/src/main/assets/www
          cp gymnastics_delay_cam.html tailwind.css android/app/src/main/assets/www/

      - name: 署名鍵を復元
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets に KEYSTORE_BASE64 が登録されていません"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.p12

      - name: APKをビルド
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: リリースに公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk delay_cam.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest delay_cam.apk \
            --title "Androidアプリ 最新版 (1.0.${{ github.run_number }})" \
            --notes "体操競技 遅延再生モニター（鯖江高校体操部作成）のAndroidアプリです。delay_cam.apk をダウンロードしてインストールしてください。インストール後はインターネット接続なしで動きます。" \
            --latest
